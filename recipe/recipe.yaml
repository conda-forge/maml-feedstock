schema_version: 1

context:
  name: maml
  version: 2026.11.17
  python_min: '3.10'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/maml-${{ version }}.tar.gz
  sha256: 69435a0c302585e75b64432b6a1ce53d3aee8eab3eac72ab22dfa6f67aa3ce75

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=43.0.0
    - pip
  run:
    - mp-api
    - python >=${{ python_min }}
    - numpy
    - scipy
    - monty >=2026.10.21
    - scikit-learn >=1.6.1
    - pymatgen >=2026.10.24
    - pymatgen-core >=2026.10.16
    - matgl >=4.1.1
    - fastcluster >=1.3.0
tests:
  - python:
      imports:
        - maml
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: maml is a machine learning library for materials science.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://materialsvirtuallab.github.io/maml

extra:
  recipe-maintainers:
    - jan-janssen
