schema_version: 1

context:
  name: maml
  version: "2025.4.3"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/maml-${{ version }}.tar.gz
  sha256: 3ad97ab5b7a4db4dbb1840e0200686e476fdb380b1515765137852d59a49b9a8

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=43.0.0
    - pip
  run:
    - mp-api
    - python >=${{ python_min }}
    - numpy
    - scipy
    - monty
    - scikit-learn >=1.6.1
    - pandas
    - pymatgen
    - tqdm

tests:
  - python:
      imports:
        - maml
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: maml is a machine learning library for materials science.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://materialsvirtuallab.github.io/maml

extra:
  recipe-maintainers:
    - jan-janssen
