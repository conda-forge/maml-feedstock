schema_version: 1

context:
  name: maml
  version: 2026.11.12
  python_min: '3.10'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/maml-${{ version }}.tar.gz
  sha256: 09a4bd6bd730a1001bffbf25a5099b93e0c04c78703530b170ed75d568bae5cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=43.0.0
    - pip
  run:
    - mp-api
    - python >=${{ python_min }}
    - numpy
    - scipy
    - monty >=2026.10.21
    - scikit-learn >=1.6.1
    - pymatgen >=2026.10.24
    - matgl >=4.1.1
    - pymatgen-core >=2026.10.16
    - fastcluster >=1.3.0
tests:
  - python:
      imports:
        - maml
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: maml is a machine learning library for materials science.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://materialsvirtuallab.github.io/maml

extra:
  recipe-maintainers:
    - jan-janssen
